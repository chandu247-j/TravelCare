<title>Travel Care — Onboarding</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;700&display=swap');
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:#dfe5e6; display:flex; justify-content:center; padding:24px 0; min-height:100vh; font-family:'Inter',sans-serif;}
.screen{
  position:relative; width:440px; height:956px; background:#fff;
  box-shadow:0 8px 40px rgba(0,0,0,.15); border-radius:28px; overflow:hidden; margin:0 12px;
}
.status-bar{position:absolute; left:21px; top:21px; width:398px; height:19px; z-index:2;}
.blur-top{position:absolute; left:0; top:0; width:440px; height:410px; z-index:0;}
.blur-bottom{position:absolute; left:-16px; top:687px; width:368px; height:369px; z-index:0;}
.logo{position:absolute; left:calc(50% - 80.7px); top:69px; width:161.4px; height:143px; z-index:1;}
.title{
  position:absolute; left:0; top:220px; width:100%; text-align:center;
  font-family:'Montserrat',sans-serif; font-weight:800; font-size:36px; margin:0;
  background:linear-gradient(90deg,#00151b 10.8%,#529bb2 24.3%,#35829a 35.4%,#00536d 45.1%,#00151b 50.1%,#000002 60.2%,#005d7a 66.3%,#006b8d 80.2%,#002531 91.3%,#00151b 100%,#008eba 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  z-index:1;
}
.tagline{position:absolute; left:0; top:280px; width:100%; text-align:center; font-size:20px; color:#000; z-index:1;}
.tagline p{margin:0 0 6px;}
.desc{position:absolute; left:0; top:378px; width:100%; text-align:center; font-size:16px; color:#000; line-height:24px; z-index:1;}
.desc p{margin:0;}
.hero{position:absolute; left:-2px; top:429px; width:443px; height:307px; z-index:0;}
.menu{position:absolute; left:0; top:752px; width:100%; height:70px; z-index:1;}
.menu-icon{position:absolute; top:0; height:24px;}
.menu-icon.verified{left:66px; width:29px;}
.menu-icon.pricing{left:196px; width:35px;}
.menu-icon.lang{left:334px; width:24px;}
.menu-label{position:absolute; top:35px; font-size:16px; color:#000; text-align:center; margin:0; line-height:19px;}
.menu-label.verified{left:49px; width:65px; text-align:left;}
.menu-label.pricing{left:187px; width:52px;}
.menu-label.lang{left:301px; width:90px;}
.divider{position:absolute; top:4px; width:1px; height:49px; background:#e5e5e5; z-index:1;}
.divider.d1{left:149px;}
.divider.d2{left:281px;}
.btn{
  position:absolute; left:calc(50% - 171px); width:342px; height:40px; border-radius:10px;
  display:flex; align-items:center; justify-content:center; font-family:'Montserrat',sans-serif;
  font-weight:700; font-size:20px; text-decoration:none; cursor:pointer; z-index:1;
}
.btn-primary{top:843px; background:#008783; color:#fff; border:none;}
.btn-outline{top:893px; background:transparent; color:#008783; border:1px solid #008783;}
</style>
